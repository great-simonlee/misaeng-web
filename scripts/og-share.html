<!doctype html>
<!-- Source for public/og/share-{housing,default}.png. Regenerate: Chrome --headless=new --window-size=1200,630 --screenshot=… "file://…/scripts/og-share.html?kind=housing|default" -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
    background: linear-gradient(135deg, #F64310 0%, #FF6A2E 55%, #FF8A4C 100%);
    color: #fff; position: relative;
  }
  .glow { position: absolute; border-radius: 50%; background: rgba(255,255,255,.10); }
  .g1 { width: 520px; height: 520px; right: -120px; top: -160px; }
  .g2 { width: 300px; height: 300px; left: -90px; bottom: -120px; background: rgba(255,255,255,.07); }
  .left { position: absolute; left: 80px; top: 86px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .logo { width: 84px; height: 84px; border-radius: 22px; background: #fff; display: grid; place-items: center;
          box-shadow: 0 10px 30px rgba(120,30,0,.25); }
  .logo img { width: 72px; height: 72px; }
  .word { font-size: 46px; font-weight: 800; letter-spacing: -0.5px; }
  .word small { display: block; font-size: 20px; font-weight: 600; opacity: .9; letter-spacing: 0; margin-top: 2px; }
  h1 { margin-top: 64px; font-size: 58px; line-height: 1.22; font-weight: 800; letter-spacing: -1.5px; }
  .sub { margin-top: 22px; font-size: 26px; font-weight: 600; opacity: .95; }
  .chips { margin-top: 30px; display: flex; gap: 12px; }
  .chip { padding: 10px 20px; border-radius: 999px; background: rgba(255,255,255,.2); font-size: 21px; font-weight: 700; }

  .phone { position: absolute; right: 92px; top: 62px; width: 330px; height: 640px; border-radius: 52px;
           background: #111; padding: 12px; box-shadow: 0 30px 70px rgba(90,20,0,.35); transform: rotate(4deg); }
  .screen { width: 100%; height: 100%; border-radius: 42px; background: #F7F7F8; overflow: hidden; position: relative; }
  .notch { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 100px; height: 28px; border-radius: 20px; background: #111; }
  .appbar { padding: 54px 20px 10px; display: flex; align-items: center; gap: 8px; color: #F64310; font-weight: 800; font-size: 20px; }
  .appbar img { width: 28px; height: 28px; }
  .pill { margin-left: auto; font-size: 12px; color: #F64310; background: #FFF1ED; padding: 4px 10px; border-radius: 999px; font-weight: 700; }
  .card { margin: 8px 16px 12px; background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  .photo { height: 160px; position: relative; background: linear-gradient(180deg, #DDE7F2 0%, #F3EEE6 62%, #C99A62 62%, #B8854F 100%); }
  .win { position: absolute; left: 46px; top: 26px; width: 200px; height: 82px; background: linear-gradient(180deg,#8FB6DC,#C9DFF2);
         border: 6px solid #fff; border-radius: 4px; }
  .win::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; background: #fff; transform: translateX(-50%); }
  .heart { position: absolute; right: 14px; top: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.9);
           display: grid; place-items: center; color: #F64310; font-size: 17px; }
  .info { padding: 14px 16px 16px; color: #111; }
  .price { font-size: 26px; font-weight: 800; color: #F64310; letter-spacing: -0.5px; }
  .price span { font-size: 15px; color: #8a8a8f; font-weight: 600; }
  .meta { margin-top: 4px; font-size: 15px; color: #55555b; font-weight: 600; }
  .tags { margin-top: 10px; display: flex; gap: 6px; }
  .tag { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: #E9F8EF; color: #128a47; }
  .tag.o { background: #FFF1ED; color: #F64310; }
  .row { margin: 0 16px 10px; background: #fff; border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
  .dot { width: 40px; height: 40px; border-radius: 12px; background: #FFF1ED; display: grid; place-items: center; font-size: 20px; }
  .lines div { height: 10px; border-radius: 6px; background: #E6E6EA; }
  .lines div + div { margin-top: 8px; width: 70%; }
  .lines { flex: 1; }
</style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="left">
    <div class="brand">
      <div class="logo"><img src="../public/img/logo_square.png" alt=""></div>
      <div class="word">Misaeng<small>미생 · 미국 유학생·직장인 커뮤니티</small></div>
    </div>
    <h1 id="headline">HEADLINE</h1>
    <p class="sub" id="sub">SUB</p>
    <div class="chips" id="chips"></div>
  </div>
  <div class="phone"><div class="screen">
    <div class="notch"></div>
    <div class="appbar"><img src="../public/img/logo_square.png" alt="">Misaeng<span class="pill">New York</span></div>
    <div class="card">
      <div class="photo"><div class="win"></div><div class="heart">♥</div></div>
      <div class="info">
        <div class="price" id="price">$4,500<span>/월</span></div>
        <div class="meta" id="meta">1B1B · Long Island City</div>
        <div class="tags"><span class="tag">중개비 무료</span><span class="tag o">인증된 매물</span></div>
      </div>
    </div>
    <div class="row"><div class="dot" id="d1">🛂</div><div class="lines"><div></div><div></div></div></div>
    <div class="row"><div class="dot" id="d2">💼</div><div class="lines"><div></div><div></div></div></div>
  </div></div>
  <script>
    const p = new URLSearchParams(location.search)
    const kind = p.get('kind') || 'housing'
    const copy = {
      housing: { h: '뉴욕에서 찾은 방,<br>미생 앱에서 확인해요', s: '인증된 매물 · 중개비 무료 혜택', c: ['하우징', '룸메이트', '서블렛'] },
      default: { h: '뉴욕 유학생·직장인의<br>진짜 이야기', s: '비자 · 면접·취업 후기 · 회사 정보', c: ['비자', '면접·취업', '하우징'] },
    }[kind]
    document.getElementById('headline').innerHTML = copy.h
    document.getElementById('sub').textContent = copy.s
    document.getElementById('chips').innerHTML = copy.c.map((c) => `<span class="chip">${c}</span>`).join('')
  </script>
</body>
</html>
