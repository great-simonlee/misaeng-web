name: AWS SSH whoami

on:
  push:
    branches:
      - feature/ci_cd
  workflow_dispatch:

jobs:
  whoami:
    name: Bastion jump and whoami
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASTION_HOST: ${{ vars.BASTION_HOST }}
      APP_HOST: ${{ vars.APP_HOST }}
      SSH_USER: ${{ vars.SSH_USER }}

    steps:
      - name: Setup SSH config
        env:
          BASTION_SSH_KEY: ${{ secrets.BASTION_SSH_KEY }}
        run: |
          if [ -z "$BASTION_SSH_KEY" ]; then
            echo "GitHub Secret BASTION_SSH_KEY가 없습니다. PEM 전체 내용을 Secrets에 넣어 주세요."
            exit 1
          fi
          if [ -z "$BASTION_HOST" ] || [ -z "$APP_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "GitHub Variables BASTION_HOST, APP_HOST, SSH_USER를 설정해 주세요."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$BASTION_SSH_KEY" | sed 's/\r$//' > ~/.ssh/bastion.pem
          chmod 600 ~/.ssh/bastion.pem
          cat > ~/.ssh/config <<EOF
          Host bastion
            HostName ${BASTION_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/bastion.pem
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new

          Host app
            HostName ${APP_HOST}
            User ${SSH_USER}
            ProxyJump bastion
            IdentityFile ~/.ssh/bastion.pem
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: whoami
        run: |
          ssh -o ConnectTimeout=15 app 'whoami; hostname; id'
